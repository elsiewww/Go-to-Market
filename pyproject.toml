[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-ops"
version = "0.1.0"
description = "Evidence-backed local marketing review queues; no external sending"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marketing-ops = "marketing_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
